name = "wildmat-todo"
main = "src/index.ts"
compatibility_date = "2025-02-12"
compatibility_flags = ["nodejs_compat"]

[vars]
DEFAULT_PROJECT = "Moving"
DEFAULT_PRIORITY = "P3"

[[routes]]
pattern = "api.wildmat.dev/todo/*"
zone_name = "wildmat.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
